# Termux app settings — linked to ~/.termux/termux.properties by termux/install.sh.
# Apply after editing with: termux-reload-settings

# Two rows of extra keys: the keys a phone keyboard lacks and this config leans on
# (Esc for vim, Ctrl/Alt for tmux and zsh widgets, Tab for completion, arrows for history).
extra-keys = [ \
    ['ESC', '/', '-', 'HOME', 'UP', 'END', 'PGUP'], \
    ['TAB', 'CTRL', 'ALT', 'LEFT', 'DOWN', 'RIGHT', 'PGDN'] \
]

# Volume keys stay volume keys rather than acting as Ctrl/Fn.
volume-keys = volume

# Back button sends Esc instead of closing the session — vim muscle memory.
back-key = escape

bell-character = ignore
