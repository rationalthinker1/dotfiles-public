[tools]
node = "lts"
python = "latest"
rust = "latest"
uv = "latest"
# mise owns vim because some plugins require 9.2 and Ubuntu 24.04 caps out at
# 9.1.0016 (noble-updates; backports has nothing newer) — do not drop this back to
# the distro vim. mise's vim wins on PATH, shadowing 8 commands:
# vim/view/rvim/rview/ex/vimdiff/vimtutor/xxd.
#
# DO NOT `apt remove vim` to clear that duplication: ubuntu-wsl has a hard
# Depends: on vim, so removing it uninstalls the ubuntu-wsl metapackage too.
# The ~40MB of distro vim is the correct price; leave it installed.
#
# Pinned to a CONCRETE patch, not "9.2" or "latest". Two reasons: a future 9.3 can never
# land unattended and break the plugins this is here for, and vim tags patches almost
# daily (9.2.0921...9.2.0926 inside a week) while mise compiles it from source — see the
# mise wrapper in aliases.zsh that injects the vim build env. A series pin would rebuild
# vim on most maintain runs for no gain; this rebuilds only when the line below changes.
#
# To bump deliberately: `mise latest vim` to see what is current, edit this line, then
# `mise install`. The superseded build is reclaimed by `mise prune` in maintain phase 5.
vim = "9.2.0926"
yarn = "1"
