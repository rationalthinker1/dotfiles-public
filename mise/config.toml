[tools]
node = "lts"
python = "latest"
rust = "latest"
uv = "latest"
# mise owns vim because some plugins require 9.2 and Ubuntu 24.04 caps out at
# 9.1.0016 (noble-updates; backports has nothing newer) — do not drop this back to
# the distro vim. mise's vim wins on PATH, shadowing 8 commands:
# vim/view/rvim/rview/ex/vimdiff/vimtutor/xxd.
#
# DO NOT `apt remove vim` to clear that duplication: ubuntu-wsl has a hard
# Depends: on vim, so removing it uninstalls the ubuntu-wsl metapackage too.
# The ~40MB of distro vim is the correct price; leave it installed.
#
# Pinned to the 9.2 series rather than "latest" so a future 9.3 cannot land mid-run and
# break the plugins this is here for. Note this does NOT reduce rebuild churn: vim tags
# patches almost daily (9.2.0921...9.2.0926 within days), and mise compiles vim from
# source — see the mise wrapper in aliases.zsh that injects the vim build env. Pin a
# concrete patch (e.g. "9.2.0926") if the rebuilds ever become the annoyance.
#
# Superseded mise versions are reclaimed by `mise prune` in maintain phase 5.
vim = "9.2"
yarn = "1"
